spring.application.name=student-portal
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:file:./data/studentportal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
upload.dir=./uploads

# Email (Gmail SMTP) — replace with your credentials
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ENTER YOUR EMAIL HERE
spring.mail.password=ENTRYOUR PASSWORD HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
