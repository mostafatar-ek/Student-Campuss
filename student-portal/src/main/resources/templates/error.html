<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .error-container { background: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 4px; }
        h1 { color: #721c24; }
        pre { background: #f1f3f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
<div class="error-container">
    <h1>Error <span th:text="${status}"></span></h1>
    <p th:text="${message}"></p>
    <div th:if="${exception}">
        <h3>Exception:</h3>
        <pre th:text="${exception}"></pre>
    </div>
    <hr/>
    <a href="/">Back to Home</a>
</div>
</body>
</html>
