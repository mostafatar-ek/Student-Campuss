<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email – Student Portal</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>
<div id="auth-page" class="page active">
    <div class="auth-container">
        <div class="auth-logo">
            <i class="fas fa-envelope-open-text"></i>
            <h1>Verify your email</h1>
            <p>We sent a 6-digit code to <strong th:text="${email}"></strong></p>
        </div>

        <form th:action="@{/verify}" method="post" class="auth-form">
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code"
                       placeholder="Enter 6-digit code"
                       maxlength="6" autocomplete="one-time-code" required>
            </div>
            <div class="auth-error" th:if="${error}" th:text="${error}"></div>
            <button type="submit" class="btn btn-primary btn-block">Verify</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted)">
            Wrong email? <a th:href="@{/register}" style="color:var(--primary)">Go back</a>
        </p>
    </div>
</div>
</body>
</html>
